[project]
name = "dav-mcp"
version = "0.1.0"
description = "Apple iCloud Calendar and Contacts (CalDAV/CardDAV) MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["calendar", "contacts", "caldav", "carddav", "icloud", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=3.0.0,<4",
    "icalendar>=6.1",
    "tzdata>=2024.1",
    "vobject>=0.9.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
]

[project.scripts]
dav-mcp = "dav_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dav_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
